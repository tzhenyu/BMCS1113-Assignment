name: Build MASM Assembly and Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link ASM
      run: |
        REM Replace program.asm with your ASM file
        ml /c /coff program.asm
        link /SUBSYSTEM:CONSOLE program.obj Irvine32.lib
        REM Create output folder for release
        mkdir release
        move program.exe release\program.exe

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: MASM Build ${{ github.run_number }}
        draft: false
        prerelease: false
        body: "Automated build of program.exe from ASM."

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release\program.exe
        asset_name: program.exe
        asset_content_type: application/octet-stream
