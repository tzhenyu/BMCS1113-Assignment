name: Build MASM ASM and Release Individually

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link main.asm
      shell: pwsh
      run: |
        # Create release folder
        New-Item -ItemType Directory -Force -Path release
    
        $asmFile = "BMCS1113-Assignment/main.asm"
        $exeName = "main.exe"
    
        # Load Visual Studio environment (msbuild sets up ml.exe and link.exe)
        & "${env:VS140COMNTOOLS}..\..\VC\vcvarsall.bat" x86
    
        Write-Host "Compiling $asmFile..."
        ml /c /coff $asmFile
        link /SUBSYSTEM:CONSOLE "main.obj" Irvine32.lib /OUT:"release/$exeName"
    
        # List release folder contents
        Get-ChildItem -Path release
        
    - name: Create GitHub Release
      shell: pwsh
      run: |
        $tag = "v1.0.$($env:GITHUB_RUN_NUMBER)"
        $exeFile = "release/main.exe"
        if (Test-Path $exeFile) {
            gh release create $tag $exeFile --title "MASM Build $($env:GITHUB_RUN_NUMBER)" --notes "Automated build of main.asm"
        } else {
            Write-Host "No .exe file found. Skipping release."
        }
