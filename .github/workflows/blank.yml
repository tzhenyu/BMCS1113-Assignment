name: Build All MASM ASM and Release Individually

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link all ASM files
      shell: pwsh
      run: |
        # Create release folder
        New-Item -ItemType Directory -Force -Path release

        # Compile all .asm files
        Get-ChildItem -Path . -Filter *.asm | ForEach-Object {
            $asmFile = $_.FullName
            $exeName = "$($_.BaseName).exe"
            Write-Host "Compiling $asmFile..."
            ml /c /coff $asmFile
            link /SUBSYSTEM:CONSOLE "$($_.BaseName).obj" Irvine32.lib /OUT:"release\$exeName"
        }

        # List release folder contents
        Get-ChildItem -Path release

    - name: Authenticate GitHub CLI
      shell: pwsh
      run: |
        echo $env:GITHUB_TOKEN | gh auth login --with-token

    - name: Create GitHub Release
      id: create_release
      shell: pwsh
      run: |
        $tag = "v1.0.$($env:GITHUB_RUN_NUMBER)"
        $release = gh release create $tag release/* --title "MASM Build $($env:GITHUB_RUN_NUMBER)" --notes "Automated build of all ASM programs." --draft false --prerelease false
        Write-Host "Release created: $tag"
