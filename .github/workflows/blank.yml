name: Build All MASM ASM and Release Individually

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link all ASM files (PowerShell)
      shell: pwsh
      run: |
        # Create release folder
        New-Item -ItemType Directory -Force -Path release

        # Loop through all .asm files in repo root
        Get-ChildItem -Path . -Filter *.asm | ForEach-Object {
            $asmFile = $_.FullName
            $exeName = "$($_.BaseName).exe"
            Write-Host "Compiling $asmFile..."
            ml /c /coff $asmFile
            link /SUBSYSTEM:CONSOLE "$($_.BaseName).obj" Irvine32.lib /OUT:"release\$exeName"
        }

        # List release folder contents
        Get-ChildItem -Path release

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: MASM Build ${{ github.run_number }}
        draft: false
        prerelease: false
        body: "Automated build of all ASM programs."

    - name: Upload each EXE individually
      shell: pwsh
      run: |
        $releaseUrl = '${{ steps.create_release.outputs.upload_url }}'
        Get-ChildItem -Path release -Filter *.exe | ForEach-Object {
            Write-Host "Uploading $($_.Name)..."
            gh release upload $releaseUrl $_.FullName --clobber
        }
