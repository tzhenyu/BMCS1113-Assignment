name: Build All MASM ASM and Release Individually

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link all ASM files
      shell: pwsh
      run: |
        # Create release folder
        New-Item -ItemType Directory -Force -Path release
    
        # Compile all .asm files recursively
        Get-ChildItem -Path . -Filter *.asm -Recurse | ForEach-Object {
            $asmFile = $_.FullName
            $exeName = "$($_.BaseName).exe"
            Write-Host "Compiling $asmFile..."
            ml /c /coff $asmFile
            link /SUBSYSTEM:CONSOLE "$($_.BaseName).obj" Irvine32.lib /OUT:"release/$exeName"
        }

        # List release folder contents
        Get-ChildItem -Path release

    
    - name: Create GitHub Release with individual EXEs
      shell: pwsh
      run: |
        $tag = "v1.0.$($env:GITHUB_RUN_NUMBER)"
        # Get all EXE files from release folder
        $exeFiles = Get-ChildItem -Path release -Filter *.exe | ForEach-Object { $_.FullName }

        if ($exeFiles.Count -eq 0) {
            Write-Host "No .exe files found. Skipping release."
        } else {
            gh release create $tag $exeFiles --title "MASM Build $($env:GITHUB_RUN_NUMBER)" --notes "Automated build of all ASM programs." --draft false --prerelease false
        }
