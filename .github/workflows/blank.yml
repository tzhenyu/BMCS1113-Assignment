name: Build All MASM ASM and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link all ASM files (PowerShell)
      shell: pwsh
      run: |
        # Create release folder
        New-Item -ItemType Directory -Force -Path release

        # Loop through all .asm files in repo root
        Get-ChildItem -Path . -Filter *.asm | ForEach-Object {
            $asmFile = $_.FullName
            $exeName = "$($_.BaseName).exe"
            Write-Host "Compiling $asmFile..."
            ml /c /coff $asmFile
            link /SUBSYSTEM:CONSOLE "$($_.BaseName).obj" Irvine32.lib /OUT:"release\$exeName"
        }

        # List release folder contents
        Get-ChildItem -Path release

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: MASM Build ${{ github.run_number }}
        draft: false
        prerelease: false
        body: "Automated build of all ASM programs."

    - name: Upload all release assets as ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path release\* -DestinationPath release\program-exes.zip
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release\program-exes.zip
        asset_name: program-exes.zip
        asset_content_type: application/zip
