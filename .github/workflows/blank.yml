name: Build MASM Assembly

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Visual Studio tools
      uses: microsoft/setup-msbuild@v1

    - name: Assemble and link ASM
      run: |
        REM Change "main.asm" to your ASM file
        ml /c /coff main.asm
        link /SUBSYSTEM:CONSOLE program.obj Irvine32.lib

    - name: List output
      run: dir *.exe
